<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="ATHENA system architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#131b2e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb95f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d2bbff"/>
    </marker>
    <style>
      .title { font: 600 22px 'Space Grotesk', system-ui, sans-serif; fill: #dae2fd; }
      .sub   { font: 400 12px 'JetBrains Mono', monospace; fill: #958da1; letter-spacing: .08em; text-transform: uppercase; }
      .box   { fill: rgba(23,31,51,0.75); stroke: rgba(124,58,237,0.3); stroke-width: 1.5; }
      .box-accent { stroke: #7c3aed; stroke-width: 2; }
      .lbl   { font: 600 14px 'Space Grotesk', system-ui, sans-serif; fill: #dae2fd; }
      .meta  { font: 400 11px 'JetBrains Mono', monospace; fill: #d2bbff; }
      .svc   { font: 400 10px 'JetBrains Mono', monospace; fill: #958da1; }
      .edge  { stroke: #7c3aed; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; opacity: .7; }
      .edge-solid { stroke: #d2bbff; stroke-width: 1.8; fill: none; }
      .group-lbl { font: 600 11px 'JetBrains Mono', monospace; fill: #ffb95f; letter-spacing: .15em; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" class="title">ATHENA — System Architecture</text>
  <text x="600" y="68" text-anchor="middle" class="sub">Multi-tenant AI OS · serverless · stateless functions</text>

  <!-- User -->
  <circle cx="90" cy="340" r="38" fill="url(#gold)" filter="url(#glow)"/>
  <text x="90" y="345" text-anchor="middle" class="lbl" style="fill:#0b1326">USER</text>
  <text x="90" y="395" text-anchor="middle" class="svc">browser / mobile</text>

  <!-- Frontend card -->
  <rect x="200" y="280" width="200" height="120" rx="14" class="box box-accent"/>
  <text x="300" y="310" text-anchor="middle" class="group-lbl">Vercel Edge</text>
  <text x="300" y="338" text-anchor="middle" class="lbl">Next.js 15</text>
  <text x="300" y="360" text-anchor="middle" class="svc">App Router · Turbopack</text>
  <text x="300" y="376" text-anchor="middle" class="svc">Tailwind · shadcn/ui</text>
  <text x="300" y="392" text-anchor="middle" class="svc">Zustand · SSE client</text>

  <!-- Backend card -->
  <rect x="490" y="220" width="240" height="160" rx="14" class="box box-accent"/>
  <text x="610" y="250" text-anchor="middle" class="group-lbl">Modal Serverless</text>
  <text x="610" y="278" text-anchor="middle" class="lbl">FastAPI backend</text>
  <text x="610" y="300" text-anchor="middle" class="svc">supervisor · classifier</text>
  <text x="610" y="316" text-anchor="middle" class="svc">auth · RLS via JWT</text>
  <text x="610" y="332" text-anchor="middle" class="svc">rate limiting · audit log</text>
  <text x="610" y="354" text-anchor="middle" class="meta">+ headless Chromium</text>
  <text x="610" y="370" text-anchor="middle" class="svc">Playwright in-image</text>

  <!-- Supabase card -->
  <rect x="830" y="100" width="260" height="180" rx="14" class="box box-accent"/>
  <text x="960" y="130" text-anchor="middle" class="group-lbl">Supabase</text>
  <text x="960" y="156" text-anchor="middle" class="lbl">PostgreSQL 17</text>
  <text x="960" y="176" text-anchor="middle" class="svc">+ pgvector · + RLS</text>
  <text x="960" y="202" text-anchor="middle" class="meta">GoTrue Auth</text>
  <text x="960" y="218" text-anchor="middle" class="svc">JWT issuance · sessions</text>
  <text x="960" y="244" text-anchor="middle" class="meta">Storage</text>
  <text x="960" y="260" text-anchor="middle" class="svc">documents · audio blobs</text>

  <!-- LLM services -->
  <rect x="830" y="310" width="260" height="260" rx="14" class="box"/>
  <text x="960" y="340" text-anchor="middle" class="group-lbl">AI Services</text>

  <rect x="850" y="358" width="220" height="50" rx="8" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.4)"/>
  <text x="960" y="378" text-anchor="middle" class="lbl">Euri AI Gateway</text>
  <text x="960" y="395" text-anchor="middle" class="svc">gpt-4o-mini · streaming</text>

  <rect x="850" y="418" width="220" height="50" rx="8" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.4)"/>
  <text x="960" y="438" text-anchor="middle" class="lbl">OpenAI native</text>
  <text x="960" y="455" text-anchor="middle" class="svc">TTS · Whisper · embeddings</text>

  <rect x="850" y="478" width="220" height="50" rx="8" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.4)"/>
  <text x="960" y="498" text-anchor="middle" class="lbl">Tavily</text>
  <text x="960" y="515" text-anchor="middle" class="svc">web search for researcher</text>

  <!-- Sidecar stores -->
  <rect x="490" y="430" width="110" height="80" rx="10" class="box"/>
  <text x="545" y="460" text-anchor="middle" class="lbl">Upstash</text>
  <text x="545" y="478" text-anchor="middle" class="svc">Redis cache</text>
  <text x="545" y="494" text-anchor="middle" class="svc">rate limit</text>

  <rect x="620" y="430" width="110" height="80" rx="10" class="box"/>
  <text x="675" y="460" text-anchor="middle" class="lbl">Neo4j</text>
  <text x="675" y="478" text-anchor="middle" class="svc">AuraDB</text>
  <text x="675" y="494" text-anchor="middle" class="svc">knowledge graph</text>

  <!-- Edges -->
  <!-- User ↔ Frontend -->
  <line x1="130" y1="340" x2="195" y2="340" class="edge-solid" marker-end="url(#arrow)"/>
  <line x1="195" y1="360" x2="130" y2="360" class="edge-solid" marker-end="url(#arrow)"/>
  <text x="162" y="330" text-anchor="middle" class="svc" style="fill:#d2bbff">HTTPS</text>

  <!-- Frontend ↔ Backend -->
  <line x1="400" y1="310" x2="485" y2="270" class="edge-solid" marker-end="url(#arrow)"/>
  <line x1="485" y1="320" x2="400" y2="360" class="edge-solid" marker-end="url(#arrow)"/>
  <text x="440" y="295" class="svc" style="fill:#d2bbff">JWT · SSE</text>

  <!-- Frontend ↔ Supabase Auth (direct) -->
  <path d="M 400 285 Q 620 90 830 160" class="edge" marker-end="url(#arrow)"/>
  <text x="560" y="120" text-anchor="middle" class="svc" style="fill:#ffb95f">supabase-js (auth only)</text>

  <!-- Backend ↔ Supabase -->
  <line x1="730" y1="260" x2="825" y2="200" class="edge-solid" marker-end="url(#arrow)"/>
  <line x1="825" y1="220" x2="730" y2="290" class="edge-solid" marker-end="url(#arrow)"/>

  <!-- Backend ↔ LLMs -->
  <line x1="730" y1="320" x2="825" y2="380" class="edge-solid" marker-end="url(#arrow)"/>
  <line x1="730" y1="350" x2="825" y2="440" class="edge-solid" marker-end="url(#arrow)"/>
  <line x1="730" y1="370" x2="825" y2="500" class="edge-solid" marker-end="url(#arrow)"/>

  <!-- Backend ↔ Upstash/Neo4j -->
  <line x1="545" y1="380" x2="545" y2="428" class="edge-solid" marker-end="url(#arrow)"/>
  <line x1="675" y1="380" x2="675" y2="428" class="edge-solid" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="30" y="630" class="sub">legend</text>
  <line x1="30" y1="648" x2="70" y2="648" class="edge-solid" marker-end="url(#arrow)"/>
  <text x="80" y="652" class="svc">server-side call</text>
  <line x1="230" y1="648" x2="270" y2="648" class="edge" marker-end="url(#arrow)"/>
  <text x="280" y="652" class="svc">browser → service (auth)</text>

  <text x="1170" y="660" text-anchor="end" class="svc">athena-ai · github.com/Vishal-ml-ds/athena-ai</text>
</svg>
