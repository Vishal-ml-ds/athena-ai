<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ATHENA AI - Preferences Calibration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-fixed": "#e0e3e5",
                        "on-secondary": "#472a00",
                        "surface": "#0b1326",
                        "on-primary-fixed": "#25005a",
                        "inverse-on-surface": "#283044",
                        "secondary-fixed": "#ffddb8",
                        "secondary": "#ffb95f",
                        "on-tertiary-fixed": "#191c1e",
                        "on-error-container": "#ffdad6",
                        "background": "#0b1326",
                        "surface-container-low": "#131b2e",
                        "outline": "#958da1",
                        "on-surface": "#dae2fd",
                        "on-primary": "#3f008e",
                        "on-tertiary-container": "#e4e6e8",
                        "secondary-container": "#ee9800",
                        "primary": "#d2bbff",
                        "surface-tint": "#d2bbff",
                        "surface-container-highest": "#2d3449",
                        "outline-variant": "#4a4455",
                        "surface-container-high": "#222a3d",
                        "on-surface-variant": "#ccc3d8",
                        "on-secondary-fixed-variant": "#653e00",
                        "on-tertiary-fixed-variant": "#444749",
                        "on-secondary-fixed": "#2a1700",
                        "inverse-primary": "#732ee4",
                        "on-tertiary": "#2d3133",
                        "tertiary": "#c4c7c9",
                        "primary-fixed-dim": "#d2bbff",
                        "inverse-surface": "#dae2fd",
                        "tertiary-container": "#646769",
                        "primary-container": "#7c3aed",
                        "error": "#ffb4ab",
                        "primary-fixed": "#eaddff",
                        "surface-variant": "#2d3449",
                        "on-background": "#dae2fd",
                        "surface-container": "#171f33",
                        "on-primary-fixed-variant": "#5a00c6",
                        "surface-bright": "#31394d",
                        "surface-dim": "#0b1326",
                        "on-secondary-container": "#5b3800",
                        "surface-container-lowest": "#060e20",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "on-primary-container": "#ede0ff",
                        "on-error": "#690005",
                        "secondary-fixed-dim": "#ffb95f",
                        "error-container": "#93000a"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["JetBrains Mono"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(23, 31, 51, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .custom-glow {
            box-shadow: 0 20px 40px -12px rgba(124, 58, 237, 0.12);
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23958da1' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col">
<!-- TopNavBar from Shared Components -->
<nav class="fixed top-0 w-full z-50 flex justify-between items-center px-8 h-20 bg-[#0b1326]/80 backdrop-blur-xl">
<div class="text-2xl font-bold tracking-tighter text-white font-headline">ATHENA AI</div>
<div class="hidden md:flex items-center space-x-8">
<a class="text-slate-400 font-medium hover:text-white transition-colors duration-300" href="#">Identity</a>
<a class="text-[#7C3AED] border-b-2 border-[#7C3AED] pb-1 font-bold hover:text-white transition-colors duration-300" href="#">Preferences</a>
<a class="text-slate-400 font-medium hover:text-white transition-colors duration-300" href="#">Interests</a>
</div>
<div class="flex items-center">
<button class="text-slate-400 hover:text-white transition-colors">
<span class="material-symbols-outlined">help_outline</span>
</button>
</div>
</nav>
<!-- SideNavBar (Suppressed for Onboarding logic - Transactional flow) -->
<main class="flex-grow flex items-center justify-center px-6 pt-24 pb-12 relative overflow-hidden">
<!-- Ambient Background Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="w-full max-w-[600px] relative z-10">
<!-- Progress Stepper -->
<div class="flex items-center justify-center mb-12 space-x-4">
<div class="flex flex-col items-center">
<div class="w-10 h-10 rounded-full border border-primary/40 flex items-center justify-center text-primary text-sm font-bold">1</div>
<span class="text-[10px] font-label uppercase tracking-widest mt-2 text-outline">Identity</span>
</div>
<div class="w-16 h-[2px] bg-primary-container mb-6"></div>
<div class="flex flex-col items-center">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container text-sm font-bold shadow-[0_0_15px_rgba(124,58,237,0.4)]">2</div>
<span class="text-[10px] font-label uppercase tracking-widest mt-2 text-primary">Preferences</span>
</div>
<div class="w-16 h-[2px] bg-surface-container-highest mb-6"></div>
<div class="flex flex-col items-center">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center text-outline text-sm font-bold">3</div>
<span class="text-[10px] font-label uppercase tracking-widest mt-2 text-outline">Interests</span>
</div>
</div>
<!-- Main Calibration Card -->
<div class="glass-card rounded-xl p-8 md:p-12 custom-glow relative border border-white/5">
<div class="mb-10 text-center">
<div class="inline-block px-3 py-1 bg-secondary/10 rounded-full mb-4">
<span class="text-[11px] font-label text-secondary uppercase tracking-[0.2em]">Environment configuration</span>
</div>
<h1 class="text-3xl md:text-4xl font-headline font-bold text-white tracking-tight">Calibrating your environment</h1>
</div>
<form class="space-y-8">
<!-- Location & Language Group -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="text-[10px] font-label text-outline uppercase tracking-wider block ml-1">Timezone</label>
<select class="w-full bg-surface-container-lowest border-none text-on-surface rounded-lg px-4 py-3 focus:ring-1 focus:ring-primary/40 transition-all text-sm font-medium">
<option selected="">UTC-08:00 (Pacific Time)</option>
<option>UTC-05:00 (Eastern Time)</option>
<option>UTC+00:00 (GMT)</option>
<option>UTC+01:00 (Central European)</option>
<option>UTC+09:00 (Japan Standard)</option>
</select>
</div>
<div class="space-y-2">
<label class="text-[10px] font-label text-outline uppercase tracking-wider block ml-1">Language</label>
<select class="w-full bg-surface-container-lowest border-none text-on-surface rounded-lg px-4 py-3 focus:ring-1 focus:ring-primary/40 transition-all text-sm font-medium">
<option selected="">English (US)</option>
<option>English (UK)</option>
<option>Spanish</option>
<option>French</option>
<option>German</option>
<option>Mandarin</option>
</select>
</div>
</div>
<!-- Theme & AI Voice Group -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-end">
<div class="space-y-4">
<label class="text-[10px] font-label text-outline uppercase tracking-wider block ml-1">Interface Theme</label>
<div class="inline-flex p-1 bg-surface-container-lowest rounded-full w-full">
<button class="flex-1 py-2 px-4 rounded-full text-sm font-medium transition-all bg-primary-container text-white shadow-lg" type="button">
<div class="flex items-center justify-center space-x-2">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">dark_mode</span>
<span>Dark</span>
</div>
</button>
<button class="flex-1 py-2 px-4 rounded-full text-sm font-medium text-outline hover:text-on-surface transition-all" type="button">
<div class="flex items-center justify-center space-x-2">
<span class="material-symbols-outlined text-lg">light_mode</span>
<span>Light</span>
</div>
</button>
</div>
</div>
<div class="space-y-2">
<label class="text-[10px] font-label text-outline uppercase tracking-wider block ml-1">Preferred AI voice</label>
<select class="w-full bg-surface-container-lowest border-none text-on-surface rounded-lg px-4 py-3 focus:ring-1 focus:ring-primary/40 transition-all text-sm font-medium">
<option selected="">Athena (Default)</option>
<option>Nova</option>
<option>Onyx</option>
<option>Echo</option>
<option>Solstice</option>
</select>
</div>
</div>
<!-- Action Area -->
<div class="pt-6">
<button class="w-full bg-gradient-to-br from-primary-container to-primary text-on-primary-container font-headline font-bold py-4 rounded-lg shadow-xl shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center space-x-2" type="submit">
<span>Continue</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center mt-6 text-xs text-outline font-label">
<span class="text-secondary opacity-80">v2.0.4 - Celestial</span> Pulse Active
                        </p>
</div>
</form>
</div>
<!-- Footer Decorative -->
<div class="mt-8 flex justify-between items-center px-4">
<div class="flex items-center space-x-2">
<div class="w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_#ffb95f]"></div>
<span class="text-[10px] font-label text-outline uppercase tracking-tighter">System Ready</span>
</div>
<div class="text-[10px] font-label text-outline/40 uppercase tracking-tighter">
                    Encrypted Protocol 88-X
                </div>
</div>
</div>
</main>
<!-- Optional Visual Elements -->
<div class="fixed bottom-10 right-10 opacity-20 pointer-events-none">
<div class="w-32 h-32 border border-primary rounded-full flex items-center justify-center">
<div class="w-24 h-24 border border-primary/40 rounded-full flex items-center justify-center">
<div class="w-16 h-16 border border-primary/20 rounded-full"></div>
</div>
</div>
</div>
</body></html>
